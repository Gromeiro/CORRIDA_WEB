<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados da Corrida - Totais</title>
    <style>
        table {
            width: auto; /* << permite a tabela ocupar apenas o necessário */
            border-collapse: collapse;
        }
    
        th, td {
            padding: 6px 12px; /* padding mais pequeno para evitar colunas largas */
            border: 1px solid #ccc;
            text-align: left;
            word-break: break-word; /* << permite quebra dentro de palavras longas */
            max-width: 200px; /* << impede colunas gigantes */
        }
    
        th {
            background-color: #f4f4f4;
        }
    
        .zebra-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    
        .zebra-table tr:nth-child(odd) {
            background-color: #ffffff;
        }
    
        #dataTable {
            overflow-x: auto;
        }
    </style>

                    if (showI) table += `<th>${rows[0][7] || ''}</th>`;
                    table += '</tr>';

                    // Linhas de dados
                    for (let i = 1; i < rows.length; i++) {

                        if (showI) table += `<td>${rows[i][7] || ''}</td>`;
                        table += '</tr>';
                    }
